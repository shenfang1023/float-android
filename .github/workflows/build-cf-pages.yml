name: Build static site

# Checks that the website build still produces out/.
# Hosting itself is method 2 in the README: Netlify, Cloudflare Pages, Vercel, or any static server.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "entries/**"
      - "components/**"
      - "lib/**"
      - "styles/**"
      - "public/**"
      - "custom-apps/**"
      - "app-store-apps/**"
      - "world-builder/**"
      - "characters/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "netlify.toml"
      - "vercel.json"
      - ".npmrc"
      - ".github/workflows/build-cf-pages.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static export
        run: npm run build

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out
          if-no-files-found: error
          retention-days: 3
